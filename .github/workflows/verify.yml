name: Verify release binaries

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            binary: vips-x64
          - runner: ubuntu-24.04-arm
            binary: vips-arm64
          - runner: windows-2025
            binary: vips-x86_64.exe
          - runner: windows-11-arm
            binary: vips-aarch64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact tag artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36383895870 --repo ente/libvips-packaging --name ${{ matrix.binary }} --dir binaries
      - name: Exercise conversion and thumbnails
        run: python verify.py binaries/${{ matrix.binary }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: results-${{ matrix.binary }}
          path: results/
          if-no-files-found: warn
